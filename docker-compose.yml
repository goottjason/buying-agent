version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: buying-agent-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: goottjason
      MYSQL_USER: goottjason
      MYSQL_PASSWORD: mimi1570!!@
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mariadb_data:
