plugins {
    id 'base'
}

def frontendDir = "$projectDir"
def backendOutput = "$projectDir/../api/src/main/resources/static"

/**
 * [1] npm install 수행
 */
task npmInstall(type: Exec) {
    group = 'frontend'
    description = 'Install frontend dependencies'
    workingDir frontendDir
    inputs.file "$frontendDir/package.json"
    outputs.dir "$frontendDir/node_modules"

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'install'
    } else {
        commandLine 'npm', 'install'
    }
}

/**
 * [2] npm run build (Vite 빌드) 수행
 */
task buildFrontend(type: Exec) {
    group = 'frontend'
    description = 'Build frontend project'
    dependsOn npmInstall
    workingDir frontendDir
    
    // 입력 파일 설정 (캐싱을 위해 중요)
    inputs.dir "$frontendDir/src"
    inputs.dir "$frontendDir/public"
    inputs.file "$frontendDir/index.html"
    inputs.file "$frontendDir/package.json"
    
    // vite.config.js 등이 있으면 포함
    if (file("$frontendDir/vite.config.js").exists()) inputs.file "$frontendDir/vite.config.js"
    if (file("$frontendDir/vite.config.ts").exists()) inputs.file "$frontendDir/vite.config.ts"

    outputs.dir "$frontendDir/dist"

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

/**
 * [3] 빌드된 결과물을 백엔드(api) 리소스 폴더로 복사
 */
task copyFrontendToResources(type: Copy) {
    group = 'frontend'
    description = 'Copy build output to api resources'
    dependsOn buildFrontend
    
    // 기존 정적 파일 삭제 (선택적)
    doFirst {
        delete backendOutput
    }

    from "$frontendDir/dist"
    into backendOutput
}

// Gradle 'build' 라이프사이클에 frontend 복사 작업 포함
build.dependsOn copyFrontendToResources

// 'api' 모듈이 실행되기 전이나 빌드될 때 frontend 빌드가 완료되도록 보장하기 위해
// 프로젝트 간 의존성 설정을 권장하지만, 일단 요청하신 대로 frontend 설정을 완료했습니다.
